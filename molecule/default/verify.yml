# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/9bce2bfb8f4a/src/ansiblelint/schemas/playbook.json
---
- name: Verify APT package metrics exporter
  hosts: all
  gather_facts: false
  vars_files: [../../defaults/main.yml]

  tasks:
    - name: Ensure exporter script state is available
      register: _apt_packages_exporter_test_script
      ansible.builtin.stat:
        path: /usr/local/bin/apt-packages-exporter
        checksum_algorithm: sha256

    - name: Ensure exporter script matches the release and is executable
      ansible.builtin.assert:
        that:
          - _apt_packages_exporter_test_script.stat.mode == '0755'
          - >-
            _apt_packages_exporter_test_script.stat.checksum ==
            'e3007d1d455df9fbd3bfd611e664acc689a4589a8de86f88c30285650be728b5'

    - name: Ensure check mode verifies the installed script without network access
      register: _apt_packages_exporter_test_check
      check_mode: true
      ansible.builtin.get_url:
        url: http://127.0.0.1:1/unused
        dest: "{{ apt_packages_exporter_script_filename }}"
        checksum: "{{ apt_packages_exporter_script_checksum }}"
        mode: "u=rwx,g=rx,o=rx"
        use_proxy: false
        timeout: 2

    - name: Ensure check mode reports no changes for the installed script
      ansible.builtin.assert:
        that: [not _apt_packages_exporter_test_check.changed]

    - name: Ensure effective APT settings are available
      changed_when: false
      register: _apt_packages_exporter_test_periodic_config
      ansible.builtin.command: apt-config dump

    - name: Ensure periodic APT checks cannot install packages or send notifications
      ansible.builtin.assert:
        that:
          - "'APT::Periodic::Enable \"1\";' in _apt_packages_exporter_test_periodic_config.stdout"
          - "'APT::Periodic::Update-Package-Lists \"1\";' in _apt_packages_exporter_test_periodic_config.stdout"
          - "'APT::Periodic::Unattended-Upgrade \"0\";' in _apt_packages_exporter_test_periodic_config.stdout"
          - "'APT::Periodic::Download-Upgradeable-Packages \"0\";' in _apt_packages_exporter_test_periodic_config.stdout"
          - "'APT::Periodic::Verbose \"0\";' in _apt_packages_exporter_test_periodic_config.stdout"
          - "'Unattended-Upgrade::Mail ' not in _apt_packages_exporter_test_periodic_config.stdout"

    - name: Ensure periodic APT timer state is available
      register: _apt_packages_exporter_test_periodic_timer
      ansible.builtin.systemd_service:
        name: apt-daily.timer

    - name: Ensure periodic APT timer is enabled and running
      ansible.builtin.assert:
        that:
          - _apt_packages_exporter_test_periodic_timer.status.ActiveState == 'active'
          - _apt_packages_exporter_test_periodic_timer.status.UnitFileState == 'enabled'

    - name: Ensure stale metrics are absent before testing the APT hook
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile_collector/apt.prom
        state: absent

    - name: Ensure periodic APT update stamp is absent
      ansible.builtin.file:
        path: /var/lib/apt/periodic/update-stamp
        state: absent

    - name: Ensure random delay is disabled for the periodic APT test
      ansible.builtin.copy:
        dest: /tmp/apt-periodic-test.conf
        content: 'APT::Periodic::RandomSleep "0";'
        mode: "u=rw,g=r,o=r"

    - name: Ensure periodic APT checks generate metrics
      changed_when: false

      environment:
        APT_CONFIG: /tmp/apt-periodic-test.conf

      ansible.builtin.command: /usr/lib/apt/apt.systemd.daily update

    - name: Ensure generated metrics are available
      register: _apt_packages_exporter_test_metrics
      ansible.builtin.slurp:
        src: /var/lib/node_exporter/textfile_collector/apt.prom

    - name: Ensure the APT hook exports Prometheus metrics
      ansible.builtin.assert:
        that:
          - "'apt_reboot_required ' in (_apt_packages_exporter_test_metrics.content | b64decode)"

    - name: Ensure generated metrics are readable
      register: _apt_packages_exporter_test_output
      ansible.builtin.stat:
        path: /var/lib/node_exporter/textfile_collector/apt.prom

    - name: Ensure metric permissions allow textfile collection
      ansible.builtin.assert:
        that: [_apt_packages_exporter_test_output.stat.mode == '0644']
