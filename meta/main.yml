# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/meta.json
---
galaxy_info:
  namespace: insan3d
  role_name: apt_packages_exporter
  author: Alexander Pozlevich
  license: MIT

  min_ansible_version: "2.20"
  platforms:
    - name: Debian
      versions:
        - buster
        - bullseye
        - bookworm
        - trixie

    - name: Ubuntu
      versions:
        - bionic
        - focal
        - jammy
        - kinetic
        - noble

  description: >-
    Downloads and installs latest C(apt_packages_exporter)
    (https://github.com/insan3d/apt_packages_exporter) script as C(APT) hook.
    Metrics are exported in text format to be found and served by
    C(node_exporter)'s textfile collector. Obviously, intended to be used only
    on Debian-based Linux distributions.
