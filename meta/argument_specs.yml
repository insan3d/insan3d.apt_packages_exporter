# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/9bce2bfb8f4a/src/ansiblelint/schemas/role-arg-spec.json
---
argument_specs:
  main:
    short_description: Install apt_packages_exporter with its APT hook and periodic package checks.
    author: [Alexander Pozlevich <apozlevich@gmail.com>]

    options:
      apt_packages_exporter_script_ref:
        type: str
        default: "1.0-4"
        description: Git ref to download exporter script from

      apt_packages_exporter_script_source:
        type: str
        default: >-
          https://raw.githubusercontent.com/insan3d/apt_packages_exporter/{{
          apt_packages_exporter_script_ref }}/apt_packages_exporter
        description: URL to download the exporter script from.

      apt_packages_exporter_script_checksum:
        type: str
        default: "sha256:e3007d1d455df9fbd3bfd611e664acc689a4589a8de86f88c30285650be728b5"
        description: >-
          Checksum of the exporter script. The default matches ref 1.0-4;
          provide a matching checksum when overriding the ref or source URL.
          An empty value disables verification and can report false changes in check mode.

      apt_packages_exporter_script_filename:
        type: path
        default: /usr/local/bin/apt-packages-exporter
        description: Filename to put script on target machine

      apt_packages_exporter_hook_filename:
        type: path
        default: /etc/apt/apt.conf.d/50metrics
        description: C(APT) hook filename

      apt_packages_exporter_output:
        type: path
        default: /var/lib/node_exporter/textfile_collector/apt.prom
        description: >-
          Path to file from which C(node_exporter) collects text metrics

      apt_packages_exporter_periodic_options:
        type: dict

        description:
          - Mapping of APT configuration keys to string values.
          - A null value clears the corresponding option with the APT clear directive.
          - Replaces the complete default mapping when overridden.
