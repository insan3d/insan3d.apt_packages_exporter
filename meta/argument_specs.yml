# yamllint disable rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/role-arg-spec.json
# yamllint enable rule:line-length
---
argument_specs:
  main:
    short_description: Setups apt_packages_exporter
    author:
      - Alexander Pozlevich <a.pozlevich@big3.ru>

    options:
      apt_packages_exporter_script_ref:
        type: str
        default: "1.0-4"
        description: Git ref to download exporter script from

      apt_packages_exporter_script_source:
        type: str
        description: URL to get exporter script from
        default: >-
          https://raw.githubusercontent.com/insan3d/apt_packages_exporter/{{
          apt_packages_exporter_script_ref }}/apt_packages_exporter

      apt_packages_exporter_script_checksum:
        type: str
        default: ""
        description: Optional checksum for downloaded exporter script

      apt_packages_exporter_script_filename:
        type: path
        default: /usr/local/bin/apt-packages-exporter
        description: Filename to put script on target machine

      apt_packages_exporter_hook_filename:
        type: path
        default: /etc/apt/apt.conf.d/50metrics
        description: C(APT) hook filename

      apt_packages_exporter_output:
        type: path
        default: /var/lib/node_exporter/textfile_collector/apt.prom
        description: >-
          Path to file from which C(node_exporter) collects text metrics
